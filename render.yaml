services:
  - type: web
    name: ecommerce-site
    env: node
    plan: free
    buildCommand: cd frontend && npm ci && GENERATE_SOURCEMAP=false npm run build && cd ../backend && npm ci
    startCommand: node backend/server.js
    healthCheckPath: /api/v1/
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DB_LOCAL_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_TIME
        value: 7d
      - key: COOKIE_EXPIRES_TIME
        value: 7
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: gmail
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: VIPcart
      - key: SMTP_FROM_EMAIL
        sync: false
